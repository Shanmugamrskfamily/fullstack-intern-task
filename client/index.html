<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Layora · Mini SaaS Template Store</title>
    <meta
      name="description"
      content="Browse hand-picked SaaS templates, filter by category and save your favourites. Built with React, Express and MongoDB."
    />
    <meta name="author" content="Shanmugam R" />
    <meta name="theme-color" content="#E7ECF3" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Link previews: WhatsApp, LinkedIn, Slack, X -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Layora" />
    <meta property="og:title" content="Layora · Mini SaaS Template Store" />
    <meta
      property="og:description"
      content="Browse hand-picked SaaS templates, filter by category and save your favourites."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:secure_url" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Layora template store: soft-UI template cards with favourite hearts"
    />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Layora · Mini SaaS Template Store" />
    <meta
      name="twitter:description"
      content="Browse hand-picked SaaS templates, filter by category and save your favourites."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />

    <!-- Applies the saved theme before first paint (no flash). External file, so the CSP stays strict. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <noscript>Layora needs JavaScript to run. Please enable it and reload the page.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
